<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sun Son Solar — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-dark:#0B4C8C;
    --blue:#1668B8;
    --blue-light:#EAF2FB;
    --white:#FFFFFF;
    --ink:#132433;
    --ink-soft:#5C7185;
    --line:#D7E3EF;
    --err:#C13A2E;
    --radius:8px;
    --font:'Inter', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --white:#0F1720;
      --blue-light:#132B40;
      --ink:#EAF1F8;
      --ink-soft:#93A7B9;
      --line:#24384A;
    }
  }
  :root[data-theme="dark"]{
    --white:#0F1720;
    --blue-light:#132B40;
    --ink:#EAF1F8;
    --ink-soft:#93A7B9;
    --line:#24384A;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    color:var(--ink);
    background:var(--blue-light);
    min-height:100vh;
  }

  .page{ max-width:440px; margin:0 auto; padding:56px 20px 80px; }

  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .brand-mark{
    width:32px;height:32px; border-radius:50%; background:var(--blue); flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark svg{ width:18px;height:18px; }
  .brand-name{ font-weight:700; font-size:18px; color:var(--blue-dark); }

  .card{ background:var(--white); border:1px solid var(--line); border-radius:12px; padding:32px 28px; }

  .card-head{ margin-bottom:24px; }
  .card-head h1{ font-size:22px; font-weight:700; margin:0 0 6px; color:var(--ink); }
  .card-head p{ margin:0; font-size:14px; color:var(--ink-soft); }
  .card-head a{ color:var(--blue); text-decoration:none; font-weight:600; cursor:pointer; }
  .card-head a:hover{ text-decoration:underline; }

  .field{ margin-bottom:14px; display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:13px; font-weight:500; color:var(--ink); }

  .field input{
    font-family:var(--font); font-size:14px; color:var(--ink); background:var(--white);
    border:1.5px solid var(--line); border-radius:var(--radius); padding:10px 12px;
    outline:none; width:100%; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(22,104,184,0.15); }
  .field input.err{ border-color:var(--err); }
  .field .msg-err{ font-size:12px; color:var(--err); display:none; }
  .field.invalid .msg-err{ display:block; }

  .pw-field{ position:relative; }
  .pw-toggle{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:0; color:var(--blue); font-size:12px; font-weight:600; cursor:pointer; padding:4px 6px;
  }
  .pw-toggle:hover{ text-decoration:underline; }

  .btn-primary{
    width:100%; padding:12px 16px; border:0; border-radius:var(--radius); background:var(--blue);
    color:#FFF; font-family:var(--font); font-size:15px; font-weight:600; cursor:pointer;
    transition:background .15s ease; margin-top:6px;
  }
  .btn-primary:hover{ background:var(--blue-dark); }

  .signin-success{
    display:none;
    background:var(--blue-light);
    border:1px solid var(--blue);
    border-radius:var(--radius);
    padding:12px 14px;
    font-size:13px;
    color:var(--blue-dark);
    margin-bottom:16px;
    text-align:center;
  }
  .signin-success.show{ display:block; }
</style>
</head>
<body>
<div class="page">

  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4" fill="#FFF"/><g stroke="#FFF" stroke-width="1.6" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="4.5"/><line x1="12" y1="19.5" x2="12" y2="22"/><line x1="2" y1="12" x2="4.5" y2="12"/><line x1="19.5" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="6.6" y2="6.6"/><line x1="17.4" y1="17.4" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.6" y2="17.4"/><line x1="17.4" y1="6.6" x2="19.1" y2="4.9"/></g></svg>
    </span>
    <span class="brand-name">Sun Son Solar</span>
  </div>

  <div class="card">
    <div class="card-head">
      <h1>Sign in</h1>
      <p>New to Sun Son Solar? <a href="registration.html">Create an account</a></p>
    </div>

    <div class="signin-success" id="signinSuccess">
      Account created successfully! Please sign in with your new credentials.
    </div>

    <form id="signinForm" novalidate>
      <div class="field" id="siUsernameField">
        <label for="siUsername">Username</label>
        <input type="text" id="siUsername" name="siUsername" autocomplete="username" required>
        <span class="msg-err">Enter your username.</span>
      </div>

      <div class="field" id="siPasswordField">
        <label for="siPassword">Password</label>
        <div class="pw-field">
          <input type="password" id="siPassword" name="siPassword" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" data-target="siPassword">Show</button>
        </div>
        <span class="msg-err">Enter your password.</span>
      </div>

      <button type="submit" class="btn-primary">Sign in</button>
    </form>
  </div>
</div>

<script>
  const signinForm = document.getElementById('signinForm');
  const siUsername = document.getElementById('siUsername');
  const siPassword = document.getElementById('siPassword');
  const siUsernameField = document.getElementById('siUsernameField');
  const siPasswordField = document.getElementById('siPasswordField');

  function setInvalid(fieldEl, invalid) {
    fieldEl.classList.toggle('invalid', invalid);
    const input = fieldEl.querySelector('input');
    if (input) input.classList.toggle('err', invalid);
  }

  function validateSignin() {
    let valid = true;

    if (siUsername.value.trim() === '') {
      setInvalid(siUsernameField, true);
      valid = false;
    } else {
      setInvalid(siUsernameField, false);
    }

    if (siPassword.value === '') {
      setInvalid(siPasswordField, true);
      valid = false;
    } else {
      setInvalid(siPasswordField, false);
    }

    return valid;
  }

  function setupPasswordToggle() {
    document.querySelectorAll('.pw-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        if (input.type === 'password') {
          input.type = 'text';
          btn.textContent = 'Hide';
        } else {
          input.type = 'password';
          btn.textContent = 'Show';
        }
      });
    });
  }

  function redirectByRole(role) {
    if (role === 'admin') {
      window.location.href = 'admin_dashboard.php';
    } else if (role === 'employee') {
      window.location.href = 'employee_dashboard.php';
    } else {
      window.location.href = 'customer_dashboard.php';
    }
  }

  async function submitSignin() {
    const body = new FormData();
    body.append('username', siUsername.value.trim());
    body.append('password', siPassword.value);

    try {
      const res = await fetch('signin_process.php', { method: 'POST', body });
      const data = await res.json();

      if (data.ok) {
        localStorage.setItem('sunsonsolar_user', JSON.stringify(data));
        redirectByRole(data.role);
      } else {
        alert(data.error || 'Sign in failed.');
      }
    } catch (err) {
      alert('Server error. Please try again.');
    }
  }

  function checkRegistrationSuccess() {
    if (window.location.search.includes('registered=true')) {
      document.getElementById('signinSuccess').classList.add('show');
    }
  }

  setupPasswordToggle();

  siUsername.addEventListener('input', () => {
    if (siUsername.value.trim() !== '') setInvalid(siUsernameField, false);
  });

  siPassword.addEventListener('input', () => {
    if (siPassword.value !== '') setInvalid(siPasswordField, false);
  });

  signinForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!validateSignin()) return;
    await submitSignin();
  });

  checkRegistrationSuccess();
</script>
</body>
</html>
